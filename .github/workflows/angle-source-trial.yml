# Issue #220, step 1: can a hosted runner build the source ANGLE at all?
# One uncached build of dev/g2/build-angle.sh on the macOS 27 image, reporting
# the runner, free disk before and after, the size of each part of the
# checkout, and the build time. A measurement, not a gate: its numbers decide
# the cached CI build (full sync, or a trimmed one). Removed once that lands.
#
# The pair targets macOS 27 (G3 trap 3), so it builds and loads only on
# xcode-27, GitHub's macOS 27 preview image, not on macos-26.
name: ANGLE from source (trial)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/angle-source-trial.yml

permissions:
  contents: read

jobs:
  build:
    name: build ANGLE from source (xcode-27, uncached)
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner
        run: |
          sw_vers
          xcodebuild -version
          echo "cpus $(sysctl -n hw.ncpu), memory $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          df -h "$GITHUB_WORKSPACE"

      - name: Metal Toolchain (Xcode 26+ downloads it separately)
        run: |
          if xcrun metal --version; then exit 0; fi
          start=$SECONDS
          xcodebuild -downloadComponent MetalToolchain
          echo "Metal Toolchain download: $((SECONDS - start)) s"
          xcrun metal --version

      - name: Build ANGLE (dev/g2/build-angle.sh)
        run: |
          start=$SECONDS
          bash dev/g2/build-angle.sh
          echo "build-angle.sh: $((SECONDS - start)) s"

      - name: Disk after
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh dev/g2/build/angle/depot_tools dev/g2/build/angle/angle 2>/dev/null || true
          du -sh dev/g2/build/angle/angle/third_party/* dev/g2/build/angle/angle/out 2>/dev/null \
            | sort -h | tail -15 || true

      - name: Upload the staged pair
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: angle-dist
          path: dev/g2/angle-dist/
          retention-days: 7
