# Supply-chain hygiene for CI's Homebrew dependency set.
#
# Gate = Brewfile.lock.json freshness: the checked-in Brewfile lists exactly
# the packages ci.yml brew-installs (union of the engine + comms install
# lines). Homebrew removed built-in Brewfile.lock.json generation
# (homebrew-bundle #1509, Nov 2024) and brew versions differ per machine, so
# the gate is machine-independent: it checks name parity between Brewfile and
# the committed lock; the version values are informational snapshots only.
# `brew bundle check` asserts the Brewfile is satisfiable on the runner.
# osv-scanner sweeps the repo against OSV.
name: Supply chain

on:
  pull_request:
    paths:
      - '.github/workflows/supply-chain.yml'
      - 'Brewfile'
      - 'Brewfile.lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/supply-chain.yml'
      - 'Brewfile'
      - 'Brewfile.lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brewfile-lock:
    name: Brewfile.lock.json sync + osv-scanner
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Brewfile dependencies
        run: brew bundle install --file Brewfile

      - name: Assert Brewfile is satisfied
        run: brew bundle check --file Brewfile

      - name: Fail if Brewfile.lock.json is out of sync with Brewfile
        run: |
          # Machine-independent freshness: name parity only. Versions in the
          # lock are informational snapshots (brew differs per machine).
          python3 - <<'PY'
          import json
          pkgs = sorted(line.split()[1].strip('"') for line in open("Brewfile")
                        if line.startswith("brew "))
          lock = sorted(json.load(open("Brewfile.lock.json")).get("entries", {}))
          missing = [p for p in pkgs if p not in lock]
          extra = [k for k in lock if k not in pkgs]
          if missing or extra:
              print(f"::error::Brewfile.lock.json out of sync with Brewfile "
                    f"(missing: {missing}, extra: {extra})")
              raise SystemExit(1)
          print(f"Brewfile.lock.json in sync with Brewfile ({len(pkgs)} packages)")
          PY

      - name: OSV vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@0a65f82af05cd58cf587827b0bb0489548c18346 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=osv-scan-results.json
            -r
            ./

      - name: Fail on vulnerabilities
        run: |
          if [ ! -s osv-scan-results.json ]; then
            echo "::error::osv-scanner failed without writing results — see scan step"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          results = json.load(open("osv-scan-results.json"))
          vulns = results.get("results", [])
          if vulns:
              for r in vulns:
                  for v in r.get("packages", []):
                      for issue in v.get("vulnerabilities", []):
                          pkg = v.get("package", {}).get("name", "?")
                          print(f"::error::{issue.get('id')} in {pkg} ({v.get('version', '?')})")
              sys.exit(1)
          print("No known vulnerabilities found")
          PY
