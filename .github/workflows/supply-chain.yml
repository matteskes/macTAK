# Supply-chain hygiene for CI's Homebrew dependency set.
#
# Two jobs:
#
# brewfile-lock (macos-26) — Gate = Brewfile.lock.json freshness: the
# checked-in Brewfile lists exactly the packages the workflows
# brew-install (ci.yml's engine + comms lines, spike-55.yml's), and a step below enforces
# that union against every workflow's brew install lines — a package added
# there without a Brewfile + lock update fails this job instead of
# escaping the lock and the osv scan. Note: Homebrew removed built-in
# Brewfile.lock.json generation (homebrew-bundle #1509, Nov 2024), so the
# lock is regenerated here with a deterministic script (name → version
# per entry) and diffed against the committed file; drift fails the job.
# `brew bundle check` asserts the Brewfile is satisfiable.
#
# osv-scan (ubuntu-latest) — osv-scanner sweeps the repo against OSV.
# google/osv-scanner-action is a container action, Linux-only: on the
# macos runner it dies with "Container action is only supported on Linux"
# (PRs #7, #11), the scan writes no results, and the fail-loud gate goes
# red. The scan and its gate run together here, on a Linux runner, where
# the action can actually run; everything brew-related stays on macos,
# where the dep set is consumed.
name: Supply chain

on:
  pull_request:
    paths:
      # every workflow: the drift step below reads all of them, so a new
      # workflow's brew install line must trigger it (g55 trap 4)
      - '.github/workflows/*.yml'
      - 'Brewfile'
      - 'Brewfile.lock.json'
  push:
    branches: [main]
    paths:
      # every workflow: the drift step below reads all of them, so a new
      # workflow's brew install line must trigger it (g55 trap 4)
      - '.github/workflows/*.yml'
      - 'Brewfile'
      - 'Brewfile.lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brewfile-lock:
    name: Brewfile.lock.json freshness
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if the Brewfile drifts from the workflows' brew install lines
        run: |
          # The Brewfile is the union of the brew install lines in every
          # workflow. A package added to a workflow without a
          # Brewfile (+ lock) update must fail here, not quietly escape the
          # lock regeneration and the osv scan. Stdlib re over the raw YAML
          # — the two-line folded scalars the install lines use included —
          # because PyYAML is not guaranteed on the runner image.
          python3 - <<'PY'
          import re, sys, pathlib
          brew = sorted(re.findall(r'^brew\s+"([^"]+)"',
                       pathlib.Path("Brewfile").read_text(), re.M))
          pkgs = set()
          for wf in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              lines = wf.read_text().splitlines()
              for i, line in enumerate(lines):
                  m = re.match(r'^(\s*)run:\s*(.*)$', line)
                  if not m:
                      continue
                  indent, val = len(m.group(1)), m.group(2).strip()
                  if val.startswith("brew install"):
                      pkgs.update(val.split()[2:])
                  elif val == ">":   # folded scalar: its more-indented lines
                      block = []
                      for cont in lines[i + 1:]:
                          if (not cont.strip()
                                  or len(cont) - len(cont.lstrip()) <= indent
                                  or re.match(r'\s*-\s', cont)):
                              break
                          block.append(cont.strip())
                      block = " ".join(block)
                      if "brew install" in block:
                          pkgs.update(block.split("brew install", 1)[1].split())
          if brew != sorted(pkgs):
              print("::error::Brewfile != union of the workflows' brew install lines")
              only_brew = sorted(set(brew) - pkgs)
              only_wf = sorted(pkgs - set(brew))
              if only_brew:
                  print("  in Brewfile only:  " + " ".join(only_brew))
              if only_wf:
                  print("  in workflows only: " + " ".join(only_wf))
              sys.exit(1)
          print(f"Brewfile matches the workflows' brew install lines ({len(brew)} packages)")
          PY

      - name: Install Brewfile dependencies
        run: brew bundle install --file Brewfile

      - name: Assert Brewfile is satisfied
        run: brew bundle check --file Brewfile

      - name: Fail if committed Brewfile.lock.json is stale
        run: |
          # Deterministic lock regeneration: name → current brew version.
          python3 - <<'PY' > Brewfile.lock.json.new
          import json, subprocess
          pkgs = [line.split()[1].strip('"') for line in open("Brewfile")
                  if line.startswith("brew ")]
          entries = {}
          for p in pkgs:
              out = subprocess.run(["brew", "list", "--versions", p],
                                   capture_output=True, text=True, check=True)
              # "name version" (one line per installed keg)
              versions = sorted({line.split(maxsplit=1)[1].strip()
                                 for line in out.stdout.splitlines() if line.strip()})
              entries[p] = versions[0] if len(versions) == 1 else sorted(versions)
          print(json.dumps({"entries": dict(sorted(entries.items()))}, indent=2))
          PY
          if ! git diff --no-index --quiet Brewfile.lock.json Brewfile.lock.json.new; then
            echo "::error::Brewfile.lock.json is stale — regenerate it and commit the update"
            git --no-pager diff --no-index Brewfile.lock.json Brewfile.lock.json.new || true
            exit 1
          fi
          rm Brewfile.lock.json.new
          echo "Brewfile.lock.json is up to date"

  osv-scan:
    name: OSV vulnerability scan
    # google/osv-scanner-action is a container action — Linux-only. On the
    # macos runner it dies with "Container action is only supported on
    # Linux" (PRs #7, #11), so the scan and its fail-loud gate run here,
    # on ubuntu, where the action works; see the file header.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OSV vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@0a65f82af05cd58cf587827b0bb0489548c18346 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=osv-scan-results.json
            -r
            ./

      - name: Fail on vulnerabilities
        run: |
          if [ ! -s osv-scan-results.json ]; then
            echo "::error::osv-scanner failed without writing results — see scan step"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          results = json.load(open("osv-scan-results.json"))
          vulns = results.get("results", [])
          if vulns:
              for r in vulns:
                  for v in r.get("packages", []):
                      for issue in v.get("vulnerabilities", []):
                          pkg = v.get("package", {}).get("name", "?")
                          print(f"::error::{issue.get('id')} in {pkg} ({v.get('version', '?')})")
              sys.exit(1)
          print("No known vulnerabilities found")
          PY
