# Supply-chain hygiene for CI's Homebrew dependency set.
#
# Gate = Brewfile.lock.json freshness: the checked-in Brewfile lists exactly
# the packages ci.yml brew-installs (union of the engine + comms install
# lines). Note: Homebrew removed built-in Brewfile.lock.json generation
# (homebrew-bundle #1509, Nov 2024), so the lock is regenerated here with a
# deterministic script (name → version per entry) and diffed against the
# committed file; drift fails the job. `brew bundle check` asserts the
# Brewfile is satisfiable. osv-scanner sweeps the repo against OSV.
name: Supply chain

on:
  pull_request:
    paths:
      - '.github/workflows/supply-chain.yml'
      - 'Brewfile'
      - 'Brewfile.lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/supply-chain.yml'
      - 'Brewfile'
      - 'Brewfile.lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brewfile-lock:
    name: Brewfile.lock.json freshness + osv-scanner
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Brewfile dependencies
        run: brew bundle install --file Brewfile

      - name: Assert Brewfile is satisfied
        run: brew bundle check --file Brewfile

      - name: Fail if committed Brewfile.lock.json is stale
        run: |
          # Deterministic lock regeneration: name → current brew version.
          python3 - <<'PY' > Brewfile.lock.json.new
          import json, subprocess
          pkgs = [line.split()[1].strip('"') for line in open("Brewfile")
                  if line.startswith("brew ")]
          entries = {}
          for p in pkgs:
              out = subprocess.run(["brew", "list", "--versions", p],
                                   capture_output=True, text=True, check=True)
              # "name version" (one line per installed keg)
              versions = sorted({line.split(maxsplit=1)[1].strip()
                                 for line in out.stdout.splitlines() if line.strip()})
              entries[p] = versions[0] if len(versions) == 1 else sorted(versions)
          print(json.dumps({"entries": dict(sorted(entries.items()))}, indent=2))
          PY
          if ! git diff --no-index --quiet Brewfile.lock.json Brewfile.lock.json.new; then
            echo "::error::Brewfile.lock.json is stale — regenerate it and commit the update"
            git --no-pager diff --no-index Brewfile.lock.json Brewfile.lock.json.new || true
            exit 1
          fi
          rm Brewfile.lock.json.new
          echo "Brewfile.lock.json is up to date"

      - name: OSV vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@0a65f82af05cd58cf587827b0bb0489548c18346 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=osv-scan-results.json
            -r
            ./

      - name: Fail on vulnerabilities
        run: |
          if [ ! -s osv-scan-results.json ]; then
            echo "::error::osv-scanner failed without writing results — see scan step"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          results = json.load(open("osv-scan-results.json"))
          vulns = results.get("results", [])
          if vulns:
              for r in vulns:
                  for v in r.get("packages", []):
                      for issue in v.get("vulnerabilities", []):
                          pkg = v.get("package", {}).get("name", "?")
                          print(f"::error::{issue.get('id')} in {pkg} ({v.get('version', '?')})")
              sys.exit(1)
          print("No known vulnerabilities found")
          PY
