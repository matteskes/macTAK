# Hermetic CoT round-trip gate: builds the engine AND the commoncommo stack
# (atak-headless is one JVM with both in-process since G1.4 — received CoT
# is persisted through the engine's DatabaseImpl JNI) and runs two headless
# clients against dev/g1/headless/fake-cot-server.py (no external TAK server
# needed) — the PR tier for dev/g1/**.

name: CoT round-trip

on:
  pull_request:
    paths:
      - 'dev/g1/**'
      - '.github/workflows/cot-roundtrip.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dev/g1/**'
      - '.github/workflows/cot-roundtrip.yml'

permissions:
  contents: read

concurrency:
  group: cot-roundtrip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cot-roundtrip:
    name: hermetic CoT round-trip (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out TAK-Product-Center/atak-civ 5.5.1.10 at the pinned commit (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAK-Product-Center/atak-civ
          ref: 9f6893dd657feacc35ec5de03dad721c2e44170e # keep in sync with local src/ (CONTRIBUTING.md, Setup)
          path: src
          fetch-depth: 1
          sparse-checkout: |
            takkernel
            commoncommo
            takcot
            takproto
            khronos
            takengine/thirdparty/tinygltfloader
            depends
          persist-credentials: false

      - name: Pull the tinygltf tarball from Git LFS (depends/ holds LFS pointers)
        run: git -C src lfs pull --include=depends/tinygltf-2.4.1-mod.tar.gz

      - name: Install engine + comms dependencies (Homebrew)
        # build-native.sh + build-commo.sh preflight lists; protoc ships with protobuf
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: >
          brew install cmake ninja rsync proj geos gdal libspatialite minizip nlohmann-json laszip googletest
          openssl@3 libxml2 protobuf libmicrohttpd curl mdbtools glib assimp

      - name: Set up Zulu 21 (arm64)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '21'
          architecture: aarch64
          cache: gradle

      - name: Kernel jars (dev/g1/kernel/build-kernel-jars.sh, verbatim)
        run: bash dev/g1/kernel/build-kernel-jars.sh

      - name: Build engine + canary (dev/g1/build-native.sh, verbatim)
        run: bash dev/g1/build-native.sh

      - name: Build comms stack (dev/g1/build-commo.sh, verbatim)
        run: bash dev/g1/build-commo.sh

      - name: TLS server-purpose canary (test/tls-purpose.sh)
        # G1.14 security audit #1: commo must accept a server cert
        # (serverAuth, or no EKU) and refuse a same-CA clientAuth-only
        # impostor. Three legs, each a fake-cot-server.py --tls presenting
        # one cert to an atak-headless SSL client (ports 18089-18091).
        run: bash dev/g1/headless/test/tls-purpose.sh

      - name: Start hermetic CoT server (fake-cot-server.py, port 8087)
        run: |
          nohup python3 dev/g1/headless/fake-cot-server.py 8087 > /tmp/cot-server.log 2>&1 < /dev/null &
          disown
          sleep 2

      - name: Headless client round-trip vs hermetic server (run.sh 15)
        # Two clients, each persisting what it receives into its own tracks DB
        # (engine DatabaseImpl JNI -> sqlite); run.sh asserts A's DB holds B's
        # presence + marker and prints the exit demo (latest fix per uid).
        env:
          FTS_HOST: 127.0.0.1
          FTS_PORT: '8087'
        run: bash dev/g1/headless/run.sh 15

      - name: Upload failed-run evidence
        # run.sh keeps both clients' logs + tracks DBs on FAIL — but in the
        # runner's TMPDIR, which dies with the job. On its failure paths it
        # now mirrors them into dev/g1/headless/build/failed-runs/; ship
        # that as an artifact so a red round-trip carries its evidence.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cot-roundtrip-failed-runs
          path: dev/g1/headless/build/failed-runs/
          if-no-files-found: ignore
