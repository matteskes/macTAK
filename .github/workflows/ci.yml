# Tier 1 per docs/ci-qa.md: native-engine PR gate, comms-stack gate, JVM
# kernel tests, shell/workflow lint.
#
# `src/` is local-only (gitignored): CI materializes the upstream tree
# (TAK-Product-Center/atak-civ 5.5.1.10) at the same pinned commit the local
# build uses, sparse, each job only what it builds. The dev/g1 and dev/g2
# scripts run verbatim — one canonical build path, no CI-specific forks.

# Runs on every pull_request (no paths filter) so the main ruleset's required
# CI checks — "native engine (macOS arm64)", "JVM tests (macOS arm64)",
# "lint (shell + workflows)" — always report. With paths-ignore, docs-only PRs
# never trigger this workflow and those required checks are stuck at
# "Expected" forever — the same gap the docs workflow closed in PR #12
# (see docs.yml's header comment).
#
# The heavy steps no-op when a PR has no CI-relevant changes: the `changes`
# job diffs the PR against its base and the steps run only on a match.
# This must stay at step level — a job-level `if` skips the whole job,
# which reports "skipped", and a skipped check does not satisfy a required
# check (same trap as above, one level down).

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  # Manual runs stay available for spot checks; no longer needed to fill
  # required checks now that pull_request triggers unconditionally.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect CI changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keeps the token (no persist-credentials: false, unlike every
          # other checkout): the diff step below runs git fetch.
          fetch-depth: 0

      - name: Diff against the PR base
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Non-PR runs (push with matching paths, dispatch): always run the gates.
          if [ "$EVENT" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          # Three-dot diff = PR's own changes. dev/ covers the engine, comms and
          # JVM gates and their scripts; .github/workflows covers this file and
          # the pinned upstream commit; Makefile wraps the build entry points.
          # A diff failure fails the job loudly rather than silently skipping.
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- 'dev' '.github/workflows' 'Makefile')
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CI-relevant changes vs ${BASE_REF} — heavy steps will skip"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  native-engine:
    name: native engine (macOS arm64)
    needs: changes
    runs-on: macos-26 # Xcode 26 toolchain — matches the verified local build; Xcode 15 (macos-14) fails on old libc++ pair constraints
    timeout-minutes: 60
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out TAK-Product-Center/atak-civ 5.5.1.10 at the pinned commit (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAK-Product-Center/atak-civ
          ref: 9f6893dd657feacc35ec5de03dad721c2e44170e # keep in sync with local src/ (CONTRIBUTING.md, Setup)
          path: src
          fetch-depth: 1
          sparse-checkout: |
            takkernel
            commoncommo
            takcot
            takproto
            khronos
            takengine/thirdparty/tinygltfloader
            depends
          persist-credentials: false

      - name: Pull the tinygltf tarball from Git LFS (depends/ holds LFS pointers)
        if: needs.changes.outputs.changed == 'true'
        run: git -C src lfs pull --include=depends/tinygltf-2.4.1-mod.tar.gz

      - name: Install engine dependencies (Homebrew)
        if: needs.changes.outputs.changed == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        # + the build-commo.sh preflight list: the layer canary below runs
        # atak-headless, which is one JVM with both stacks since G1.4.
        run: >
          brew install cmake ninja rsync proj geos gdal libspatialite minizip nlohmann-json laszip googletest
          openssl@3 libxml2 protobuf libmicrohttpd curl mdbtools glib assimp

      - name: Set up Zulu 21 (arm64)
        # build-native.sh itself needs no JDK (jni.h is pinned at
        # dev/g1/jdk-include) but its final canaries load the engine in a
        # JDK 21 JVM (dev/g1/smoke/run.sh, jni-tests), and Gradle 8.13
        # builds the kernel jars on it
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '21'
          architecture: aarch64
          cache: gradle

      - name: Kernel jars (dev/g1/kernel/build-kernel-jars.sh, verbatim)
        # takkernel 8.30.5 from src/ (public artifacts only); the canaries
        # below load them
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/kernel/build-kernel-jars.sh

      - name: Build engine + canary (dev/g1/build-native.sh, verbatim)
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/build-native.sh

      - name: Build comms stack (dev/g1/build-commo.sh, verbatim)
        # atak-headless loads libcommoncommo(jni) alongside the engine; the
        # commo-stack job below is the gate for this build, this is its consumer.
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/build-commo.sh

      - name: atak-headless offline layer open (GeoJSON/GPKG/KML/SHP via FeatureDataStore2)
        # G1 "offline map layer opens": native OGR provider parses the
        # fixture (+ ogr2ogr-derived GPKG/KML/SHP), the persistent feature
        # data store holds it, FeatureDataStore2 cursors read it back.
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/headless/test/layer.sh

      - name: Upload engine artifacts
        # Guarded: if-no-files-found is error, which would fail a no-op run.
        if: always() && needs.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-engine-macos-arm64
          path: |
            dev/g1/native-dist/libtakengine.dylib
            dev/g1/native-dist/libtakenginejni.dylib
            dev/g1/native-dist/libGLESv2-stub.dylib
            dev/g1/native-dist/takengine-tests.xml
            dev/g1/native-dist/takengine-jni-guards.xml
            dev/g1/native-dist/takengine-jni-kernel.xml
          if-no-files-found: error

  render-angle:
    name: render on ANGLE/Metal (macOS arm64)
    # G2: the engine's native renderer through ANGLE (EGL 1.5 / ES 3.0 on
    # Metal) into an EGL pbuffer, driven from the JVM. ANGLE comes from the
    # pinned Electron release (dev/g2/fetch-angle.sh, sha256-checked); the
    # engine is rebuilt with MACTAK_GLES=angle in the GLES slot. The stub
    # job above stays the engine gate; this proves the renderer contract.
    needs: changes
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out TAK-Product-Center/atak-civ 5.5.1.10 at the pinned commit (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAK-Product-Center/atak-civ
          ref: 9f6893dd657feacc35ec5de03dad721c2e44170e # keep in sync with local src/ (CONTRIBUTING.md, Setup)
          path: src
          fetch-depth: 1
          sparse-checkout: |
            takkernel
            commoncommo
            takcot
            takproto
            khronos
            takengine/thirdparty/tinygltfloader
            depends
          persist-credentials: false

      - name: Pull the tinygltf tarball from Git LFS (depends/ holds LFS pointers)
        if: needs.changes.outputs.changed == 'true'
        run: git -C src lfs pull --include=depends/tinygltf-2.4.1-mod.tar.gz

      - name: Install engine dependencies (Homebrew)
        if: needs.changes.outputs.changed == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: >
          brew install cmake ninja rsync proj geos gdal libspatialite minizip nlohmann-json laszip googletest libxml2
          openssl@3 protobuf libmicrohttpd curl swig mdbtools glib assimp

      - name: Set up Zulu 21 (arm64)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '21'
          architecture: aarch64
          cache: gradle

      - name: Kernel jars (dev/g1/kernel/build-kernel-jars.sh, verbatim)
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/kernel/build-kernel-jars.sh

      - name: GLES shim drift gate (regenerate from transplant jar x gl3.h, diff against committed)
        if: needs.changes.outputs.changed == 'true'
        run: make check-gen-gles-shim

      - name: Stage ANGLE (pinned Electron release) + EGL/ES3 triangle smoke
        if: needs.changes.outputs.changed == 'true'
        env:
          MACTAK_ANGLE_SOURCE: release
        run: bash dev/g2/fetch-angle.sh && bash dev/g2/smoke/run.sh

      - name: Window-surface smoke — compile-only gate (the run is manual, it opens a window)
        # G2 M3.0: NSWindow → CAMetalLayer → eglCreateWindowSurface is the
        # window path the pbuffer smoke doesn't cover; CI runners have no
        # WindowServer session, so the run itself stays a dev-Mac manual gate
        # (`make smoke-window`), with the readback PPM as its artifact.
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g2/smoke/run-window.sh --compile-only

      - name: Build engine + glue with ANGLE in the GLES slot
        if: needs.changes.outputs.changed == 'true'
        env:
          MACTAK_GLES: angle
        run: bash dev/g1/build-native.sh

      - name: Build comms stack (the single-JVM launcher needs both)
        id: build-commo
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/build-commo.sh

      - name: GDAL Java bindings (org.gdal against Homebrew libgdal) + smoke
        # G2.4b: the engine's raster path binds org.gdal (trap 17); the SWIG
        # bindings are generated from the sha256-pinned release tarball of the
        # *installed* GDAL and linked against the same libgdal the engine
        # dylib links (the script asserts the install names match). The smoke
        # proves load + GTiff round-trip and records the GDAL 3 axis-order
        # verdict for the engine's SpatialReference construction.
        if: needs.changes.outputs.changed == 'true'
        run: make gdal-java

      - name: Engine GDAL georeferencing on GDAL 3 (GdalLibrary.init + GdalDatasetProjection2 + /vsitakio/)
        # G2.4 b.2 (trap #48): the shadowed GdalLibrary/GdalDatasetProjection2
        # pin OAMS_TRADITIONAL_GIS_ORDER; PASS = EPSG_4326 in traditional
        # order and a GeoTIFF's pixel(0,0) <-> NW corner round-trips exactly.
        # b.1a (trap #50): init() must return true (vsi_jfile.cpp ported to
        # GDAL 3's VSI interface) and the GeoTIFF opens via /vsitakio/.
        if: needs.changes.outputs.changed == 'true'
        run: make test-gdal-projection

      - name: GLES shim Buffer-contract canary (retained pointers need a direct Buffer)
        # glVertexAttribPointer keeps its pointer until the draw call, so
        # the shim must refuse an array-backed Buffer as Android does
        # (dev/g2/render/test/gles-shim.sh, GlesShimSelfTest).
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g2/render/test/gles-shim.sh

      - name: Gesture canary (Apple Maps gestures on the engine camera, M3.4)
        # InputBridgeSelfTest on a pbuffer: drag/scroll keep the ground under
        # the pointer, wheel/pinch/double-click zoom about it, rotate and
        # option-drag turn and tilt by the right amounts (dev/g2/NOTES.md §M3.4)
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g2/render/test/input-bridge.sh

      - name: RenderSmoke argument canary (bad arguments are exit 2, not a stack trace)
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g2/render/test/args.sh

      - name: GLMapView → EGL pbuffer render smoke (no layers)
        if: needs.changes.outputs.changed == 'true'
        env:
          MACTAK_GL_DEBUG: '1'
        run: bash dev/g2/render/run.sh --frames 10 --out dev/g2/build/render-smoke.png

      - name: Render the GeoJSON fixture (FeatureLayer3 → GLBatchGeometryRenderer on ANGLE)
        # G2 M2: first map content — polygons, anti-aliased lines, labels via
        # the Java2D-backed android.graphics shims; PASS requires content pixels.
        if: needs.changes.outputs.changed == 'true'
        env:
          MACTAK_GL_DEBUG: '1'
        # through the asset-icon canary: the same render, failing on any
        # unresolved asset: URI (the point icons; dev/g2/NOTES.md §Asset icons)
        run: bash dev/g2/render/test/asset-icons.sh dev/g2/build/render-layer.png

      - name: Render an offline MBTiles basemap under the vector layer
        # G2 M2.3: raster pipeline — synthetic graticule → gdalwarp/gdal_translate
        # (Homebrew gdal CLI) → MBTiles → PersistentRasterDataStore →
        # MobileImageryRasterLayer2 → GLQuadTileNode4 textures on ANGLE.
        if: needs.changes.outputs.changed == 'true'
        env:
          MACTAK_GL_DEBUG: '1'
        run: |
          bash dev/g2/fixtures/make-basemap.sh
          bash dev/g2/render/run.sh --basemap dev/g2/build/fixtures/sf-graticule.mbtiles \
            --layer dev/g1/headless/test/fixtures/sf-landmarks.geojson --out dev/g2/build/render-basemap.png

      - name: Basemap gate negative canary (an off-frame basemap must fail the smoke)
        # The step above passes on content pixels; this proves that gate can
        # fail when the basemap contributes nothing and only the vector
        # layer draws (dev/g2/render/test/basemap-gate.sh).
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g2/render/test/basemap-gate.sh

      - name: Dynamic-size render smoke (--resize mid-run, M3.1)
        # pbuffer rebuild via NativeEgl.resize; PASS requires the surface's
        # OnSizeChangedListeners to fire and content pixels at the new size
        # (GLMapView reads width/height per frame, so that count is the proof
        # of engine uptake).
        if: needs.changes.outputs.changed == 'true'
        env:
          MACTAK_GL_DEBUG: '1'
        run: |
          bash dev/g2/render/run.sh --resize 384x256 --out dev/g2/build/render-resize.png
          bash dev/g2/render/run.sh --layer dev/g1/headless/test/fixtures/sf-landmarks.geojson \
            --resize 384x256 --out dev/g2/build/render-resize-layer.png

      - name: Window-surface render exercise (--window, M3.1)
        # First real caller of the window-surface path: the engine renders
        # into a CAMetalLayer and --resize goes through the host's
        # drawableSize before ctx.resize() proves EGL tracks it (see
        # WindowHost.m for why there is no NSWindow here: AppKit needs the
        # main thread, the java launcher's main is a spawned pthread, and
        # EGL only takes the layer — so the exercise is off-screen and
        # headless-safe, and CI gates it like the pbuffer smokes).
        if: needs.changes.outputs.changed == 'true'
        env:
          MACTAK_GL_DEBUG: '1'
        run: |
          bash dev/g2/render/run.sh --window 640x480 --resize 384x256 --frames 6 \
            --out dev/g2/build/render-window.png
          bash dev/g2/render/run.sh --window 640x480 --resize 384x256 \
            --layer dev/g1/headless/test/fixtures/sf-landmarks.geojson \
            --out dev/g2/build/render-window-layer.png

      - name: Offline layer canary on the ANGLE-linked engine
        # both canaries report every run; only a failed build skips this one
        if: ${{ !cancelled() && steps.build-commo.outcome == 'success' }}
        run: bash dev/g1/headless/test/layer.sh

      - name: Upload render artifacts
        if: always() && needs.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-angle-macos-arm64
          path: |
            dev/g2/angle-dist/PROVENANCE.txt
            dev/g2/build/render-smoke.png
            dev/g2/build/render-layer.png
            dev/g2/build/render-basemap.png
            dev/g2/build/render-resize.png
            dev/g2/build/render-resize-layer.png
            dev/g2/build/render-window.png
            dev/g2/build/render-window-layer.png
            hs_err_pid*.log
          if-no-files-found: error

  shell-compile:
    name: shell compile (macOS arm64)
    # G2 M3.2: the Swift/AppKit shell compiles on CI (clang over jni_boot.c +
    # swiftc over main.swift against the JDK's jni.h — no engine, no GUI
    # session). The run itself opens an NSWindow, so it stays the dev-Mac
    # manual gate (`make test-shell`), the same split as M3.0's compile-only
    # smoke-window step in the render-angle job.
    needs: changes
    runs-on: macos-26 # Xcode 26 toolchain — matches the verified local build
    timeout-minutes: 10
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Zulu 21 (arm64)
        # the shell boots JDK 21 in-process; build-shell.sh takes its jni.h
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '21'
          architecture: aarch64

      - name: Compile the shell (build-shell.sh, no run)
        if: needs.changes.outputs.changed == 'true'
        run: make build-shell

      - name: Shell argument canary (a missing option value is exit 2, not a crash)
        # Runs the compiled shell; parsing ends before the JVM or a window
        # exists, so no GUI session is needed (dev/g2/shell/test/args.sh).
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g2/shell/test/args.sh

  commo-stack:
    name: comms stack (macOS arm64)
    needs: changes
    runs-on: macos-26 # Xcode 26 toolchain — matches the verified local build
    timeout-minutes: 30
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out TAK-Product-Center/atak-civ 5.5.1.10 at the pinned commit (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAK-Product-Center/atak-civ
          ref: 9f6893dd657feacc35ec5de03dad721c2e44170e # keep in sync with local src/ (CONTRIBUTING.md, Setup)
          path: src
          fetch-depth: 1
          sparse-checkout: |
            commoncommo
          persist-credentials: false

      - name: Install comms dependencies (Homebrew)
        # build-commo.sh preflight list; protoc ships with protobuf
        if: needs.changes.outputs.changed == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install openssl@3 libxml2 protobuf libmicrohttpd curl

      - name: Set up Zulu 21 (arm64) — javac -h writes the JNI headers, 21 runs the canaries
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '21'
          architecture: aarch64

      - name: Build comms stack + canaries (dev/g1/build-commo.sh, verbatim; ngtcp2 for QUIC)
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/build-commo.sh

      - name: QUIC canary (make test-quic)
        # commo's streaming QUIC client on ngtcp2's ossl backend against an
        # aioquic stand-in (hash-pinned venv): a takstream handshake that
        # delivers a marker, a clientAuth-only impostor refused (security
        # #1 on the QUIC path), and a closed port's ECONNREFUSED named in
        # commo's log (g55 trap 8, patches/commo/0006)
        if: needs.changes.outputs.changed == 'true'
        run: make test-quic

      - name: Upload comms artifacts
        # Guarded: if-no-files-found is error, which would fail a no-op run.
        if: always() && needs.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commo-stack-macos-arm64
          path: |
            dev/g1/native-dist/libcommoncommo.dylib
            dev/g1/native-dist/libcommoncommojni.dylib
            dev/g1/native-dist/jcommoncommo.jar
          if-no-files-found: error

  jvm-tests:
    # A required check in main's ruleset under this name (renamed from
    # "JVM tests (Zulu 8, macOS arm64)" at the 5.5 re-pin, with the ruleset).
    name: JVM tests (macOS arm64)
    needs: changes
    runs-on: macos-26 # matches the locally verified macOS/JDK 21 arm64 environment
    timeout-minutes: 40
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out TAK-Product-Center/atak-civ 5.5.1.10 at the pinned commit (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAK-Product-Center/atak-civ
          ref: 9f6893dd657feacc35ec5de03dad721c2e44170e # keep in sync with local src/ (CONTRIBUTING.md, Setup)
          path: src
          fetch-depth: 1
          sparse-checkout: |
            takkernel
            commoncommo
          persist-credentials: false

      - name: Set up Zulu 21 (arm64)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '21'
          architecture: aarch64
          cache: gradle

      - name: Kernel jars + JNI headers (dev/g1/kernel/build-kernel-jars.sh, verbatim)
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/kernel/build-kernel-jars.sh

      - name: JNI headers match the committed dev/g1/jni-include
        # build-native.sh compiles the glue against the committed headers
        # (no JDK needed there); a kernel change that alters a native
        # signature must land with its regenerated headers
        if: needs.changes.outputs.changed == 'true'
        run: |
          if ! git diff --quiet -- dev/g1/jni-include || [ -n "$(git ls-files --others --exclude-standard dev/g1/jni-include)" ]; then
            git status --short -- dev/g1/jni-include
            echo "::error::dev/g1/jni-include drifted from the kernel build — commit build-kernel-jars.sh's headers"
            exit 1
          fi

      - name: Kernel unit tests (make test-kernel)
        # takkernel's :port and :shared tests on Gradle 8.13, minus what
        # needs the TAK artifactory: Android-runtime classes and :shared's
        # desktop MIL-STD-2525 glue with its tests
        # (dev/g1/kernel/kernel-tests.gradle; dev/g1/NOTES.md G1.15).
        if: needs.changes.outputs.changed == 'true'
        run: make test-kernel

      - name: Upload test reports
        if: always() && needs.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-test-reports
          path: |
            dev/g1/kernel/build/takkernel/port/build/java/reports/tests/
            dev/g1/kernel/build/takkernel/port/build/java/test-results/test/
            dev/g1/kernel/build/takkernel/shared/build/java/reports/tests/
            dev/g1/kernel/build/takkernel/shared/build/java/test-results/test/
          if-no-files-found: warn

      - name: Data-package importer canary
        # G1.5: pure-JDK importer, so its canary needs no natives and no
        # server — openssl fixture + javac/java assertions (test/datapackage.sh).
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/headless/test/datapackage.sh

      - name: CoT text-path canary
        # Pure JDK like the importer canary: CotEvent.parse (receive) and
        # CotXml (send) — escaping, --send-marker checks, direct-child
        # <point>/<contact> lookup, XXE refusal (test/cot.sh).
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/headless/test/cot.sh

      - name: android.net.Uri stand-in canary
        # Pure JDK: Uri.fromFile round trips for paths holding URI syntax
        # (the engine opens its databases through it), Android's
        # encode/decode rules, and parse (dev/g2/render/test/uri.sh).
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g2/render/test/uri.sh

      - name: Compile-only gate for the headless launcher src
        # #29: nothing above type-checked dev/g1/headless/src — the launcher
        # javacs itself at launch (atak-headless), so HeadlessCLI.java and the
        # --datapackage precedence block compiled on contributor machines
        # alone. Same contract, still no natives: the commo API classes are
        # javac'd from this checkout (exactly the sources build-commo.sh
        # seeds jcommoncommo.jar with), then test/compile-gate.sh runs the
        # launcher's own compile line (JDK 21, -Xlint:all -Werror, the same
        # kernel-jar classpath).
        if: needs.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          commo_api="$RUNNER_TEMP/commo-api-classes"
          mkdir -p "$commo_api"
          find src/commoncommo/jni/com/atakmap/commoncommo -maxdepth 1 \
            -name '*.java' ! -name 'InternalNativeInitializer.java' \
            > "$RUNNER_TEMP/commo-api-srcs.txt"
          javac -d "$commo_api" @"$RUNNER_TEMP/commo-api-srcs.txt"
          bash dev/g1/headless/test/compile-gate.sh "$commo_api"

  lint:
    name: lint (shell + workflows)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (all workflow files)
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Transplant jar integrity (make check-transplants)
        # Every committed transplant jar must be listed in its SHA256SUMS
        # and match it; an unlisted jar fails too. Runs on every PR (no
        # changes guard): CI loads these jars into a JVM next to native
        # code, and until this step only the opt-in pre-commit hook checked
        # them (G1 security audit, dev/g1/NOTES.md §G1.14).
        run: bash dev/check-transplants.sh

      - name: shellcheck + bash -n (dev/**/*.sh)
        if: needs.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          scripts=(dev/**/*.sh dev/g1/headless/atak-headless) # launcher has no .sh suffix
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "error: no scripts matched dev/**/*.sh" >&2
            exit 1
          fi
          shellcheck "${scripts[@]}"
          for s in "${scripts[@]}"; do bash -n "$s"; done
          echo "lint OK: ${#scripts[@]} script(s)"

      - name: No exec past an EXIT trap (dev/check-trap-exec.sh)
        # exec replaces the shell, so an EXIT trap armed before it never
        # fires and its cleanup is skipped on every run.
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/check-trap-exec.sh

      - name: No early-exit grep under pipefail (dev/check-pipefail-grep.sh)
        # grep -q / -m quits on the first match, the writer takes SIGPIPE,
        # and pipefail turns a match into a failure.
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/check-pipefail-grep.sh

      - name: python + powershell syntax (dev/reference/tools)
        # Post-G0-audit coverage gap: lint covered dev/**/*.sh only, so a
        # syntax error in the committed CoT witness rig surfaced mid-
        # verification against a live server, not in CI. py_compile is
        # stdlib; the PowerShell parser check catches capture.ps1 typos
        # without running it (running it needs a VM display). pwsh ships on
        # GitHub's ubuntu-24.04 image.
        if: needs.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 -m py_compile dev/reference/tools/*.py
          python3 -m py_compile dev/check-ots-profiles.py
          rm -rf dev/reference/tools/__pycache__ dev/__pycache__
          # shellcheck disable=SC2016  # the quoted string is PowerShell code, not shell
          pwsh -NoProfile -Command '
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path "dev/reference/tools/capture.ps1").Path,
              [ref]$null, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              $errs | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "capture.ps1 parses OK"
          '
          echo "python + powershell lint OK"