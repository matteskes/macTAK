# Tier 0 per docs/ci-qa.md: markdown lint + link check for every *.md.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/docs.yml'
  # Manual escape hatch: the main ruleset requires the markdownlint check on
  # every PR, but the paths filters above skip PRs with no docs changes —
  # dispatch it (gh workflow run docs.yml --ref <branch>) to fill the
  # required check on those.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: '**/*.md'

  link-check:
    name: lychee link check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # tak.gov rejects cloud-IP fetchers; GitHub issue/PR links trip rate limits.
          args: >-
            --no-progress --max-concurrency 4
            --exclude 'tak\.gov'
            --exclude 'github\.com/.+/(issues|pull)/'
            './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}