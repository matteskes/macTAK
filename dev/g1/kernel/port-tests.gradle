// Gradle init script (dev/g1/kernel/test-kernel.sh): takkernel's :port unit
// tests, minus the classes that drive Android runtime paths. The
// android-port substitute is compile-time only (dev/spike/g0/NOTES.md §3:
// its android.* members throw "Stub!" or return null at runtime), and these
// need the TAK-artifactory android-port to run:
//   JavaResourceManagerTest  android.content.res.Resources (12 tests)
//   BitmapTest, BitmapTests  android.graphics.Bitmap (5 tests)
// Every other :port test runs. :shared does not compile from public sources
// at 5.5 (its desktop MIL-STD-2525 glue needs the artifactory renderer); its
// tests return in a follow-up (dev/spike/g55/NOTES.md trap 11).
allprojects {
    afterEvaluate { project ->
        if (project.path == ':port') {
            project.tasks.withType(Test).configureEach {
                exclude '**/JavaResourceManagerTest*'
                exclude '**/BitmapTest.class', '**/BitmapTests.class'
            }
        }
    }
}
